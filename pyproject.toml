[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlcharts"
version = "0.1.0"
description = "Control chart pattern recognition for predictive maintenance on industrial processes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kabir Puri" }]
keywords = ["spc", "control-charts", "predictive-maintenance", "manufacturing"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2,<3",
    "scikit-learn>=1.3,<2",
    "tensorflow-cpu>=2.16,<3",
    "matplotlib>=3.5,<4",
    "seaborn>=0.13,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "pre-commit>=3,<5",
]

[project.scripts]
controlcharts = "controlcharts.cli:main"

[project.urls]
Homepage = "https://github.com/kaRpuri/ControlCharts-PatternRecognition"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
